name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit; the comment names the reviewed tag.
jobs:
  web:
    name: Web checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci --ignore-scripts

      - name: Check repository conventions
        run: |
          node scripts/check-whitespace.mjs
          node scripts/check-deployment-pins.mjs
          node scripts/generate-css-types.mjs --check
          web/node_modules/.bin/prettier --check scripts

      - name: Check, build and test web
        run: |
          npm --prefix web run format:check
          npm --prefix web run lint
          npm --prefix web run typecheck
          npm --prefix web test
          npm --prefix web run build

  go:
    name: Go checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The Go embed package needs web/dist before any vet, test or build.
      - name: Build embedded web assets
        run: |
          npm --prefix web ci --ignore-scripts
          npm --prefix web run build

      - name: Check Go formatting and modules
        run: |
          go mod verify
          go mod tidy -diff
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Check Go imports
        run: |
          unformatted=$(go run golang.org/x/tools/cmd/goimports@v0.50.0 -local harbor-console -l $(git ls-files '*.go'))
          [ -z "$unformatted" ] || { echo "$unformatted"; exit 1; }

      - name: Vet all release platforms and build tags
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go vet ./...
          done
          go vet -tags integration,scale ./...

      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: Race tests
        run: CGO_ENABLED=1 go test -race -count=1 ./...

      - name: CLI integration tests
        run: go test -tags integration ./cmd/harbor-console -count=1

  security:
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run dependency vulnerability audit
        run: |
          npm --prefix web ci --ignore-scripts
          npm --prefix web run build
          npm --prefix web audit --audit-level=high --omit=dev
          GOTOOLCHAIN="go$(sed -n 's/^go //p' go.mod)" go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  browser:
    name: Browser route matrix
    needs: [web, go]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install web dependencies
        run: npm --prefix web ci --ignore-scripts

      - name: Install browser engines
        working-directory: web
        run: npm exec -- playwright install --with-deps chromium firefox webkit

      - name: Build and run authenticated route matrix
        run: |
          npm --prefix web run build
          npm --prefix web run test:e2e

  container:
    name: Container build and smoke test
    needs: [web, go]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: harbor-console:ci
          build-args: |
            VERSION=ci

      - name: Verify image metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect harbor-console:ci --format '{{.Config.User}}')" = "nonroot:nonroot"

      - name: Smoke test container
        shell: bash
        run: |
          set -euo pipefail
          container_name=harbor-console-ci
          docker run --detach \
            --name "${container_name}" \
            --publish 127.0.0.1:18080:8080 \
            harbor-console:ci

          cleanup() {
            docker rm --force "${container_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --connect-timeout 2 --max-time 5 --fail --silent --show-error http://127.0.0.1:18080/healthz >"$RUNNER_TEMP/health.json"; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              docker logs "${container_name}"
              exit 1
            fi
            sleep 1
          done

          grep -F '{"status":"ok"}' "$RUNNER_TEMP/health.json"
          curl --connect-timeout 2 --max-time 5 --fail --silent --show-error http://127.0.0.1:18080/ | grep -F '<title>Harbor'

          docker stop --timeout 15 "${container_name}"
          test "$(docker inspect "${container_name}" --format '{{.State.ExitCode}}')" = "0"

  release-snapshot:
    name: GoReleaser snapshot build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          install-only: true

      - name: Build all release targets
        run: |
          goreleaser check
          goreleaser release --snapshot --clean

      - name: Verify embedded build metadata
        run: |
          binary=$(find bin/release -path '*linux_amd64*' -type f -name harbor-console)
          # Snapshots carry the module version Go stamped from Git (a pseudo-version).
          version=$(go version -m "$binary" | awk '$1 == "mod" { print $3 }')
          scripts/check-build-version.sh "$binary" "$version" "$(git rev-parse --short=12 HEAD)"
