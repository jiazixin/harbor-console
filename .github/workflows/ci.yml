name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          go mod download
          npm --prefix web ci --ignore-scripts

      - name: Check Go formatting
        run: |
          unformatted=$(find cmd internal web -name node_modules -prune -o -name '*.go' -print0 | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Check repository conventions
        run: |
          node scripts/check-whitespace.mjs
          node scripts/check-deployment-pins.mjs

      - name: Check and build web
        run: |
          npm --prefix web run check
          npm --prefix web run build
          npm --prefix web test

      - name: Check and test Go
        run: |
          go mod tidy -diff
          go vet ./cmd/... ./internal/... ./web
          go test -race ./cmd/... ./internal/... ./web -count=1

      - name: Build binary
        env:
          VERSION: ci
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p bin
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X harbor-console/internal/buildinfo.Version=${VERSION} -X harbor-console/internal/buildinfo.Commit=${COMMIT} -X harbor-console/internal/buildinfo.BuildDate=${BUILD_DATE}" \
            -o bin/harbor-console ./cmd/harbor-console

  security:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          go mod download
          npm --prefix web ci --ignore-scripts

      - name: Run dependency vulnerability audit
        run: |
          npm --prefix web run build
          npm --prefix web run audit
          GOTOOLCHAIN="go$(sed -n 's/^go //p' go.mod)" go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./cmd/... ./internal/... ./web

  browser:
    name: Browser route matrix
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: |
          go mod download
          npm --prefix web ci --ignore-scripts

      - name: Install browser engines
        working-directory: web
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build and run authenticated route matrix
        run: |
          npm --prefix web run build
          npm --prefix web run test:browser

  container:
    name: Container build and smoke test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Record image build timestamp
        id: metadata
        run: printf 'build_date=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          tags: harbor-console:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}

      - name: Verify image metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect harbor-console:ci --format '{{.Config.User}}')" = "nonroot:nonroot"

      - name: Smoke test container
        shell: bash
        run: |
          set -euo pipefail
          container_name=harbor-console-ci
          docker run --detach \
            --name "${container_name}" \
            --publish 127.0.0.1:18080:8080 \
            harbor-console:ci

          cleanup() {
            docker rm --force "${container_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health >/tmp/harbor-console-health.json; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              docker logs "${container_name}"
              exit 1
            fi
            sleep 1
          done

          grep -F '"service":"harbor-console"' /tmp/harbor-console-health.json
          grep -F '"status":"ok"' /tmp/harbor-console-health.json
          curl --fail --silent --show-error http://127.0.0.1:18080/ | grep -F '<title>Harbor'

          docker stop --time 15 "${container_name}"
          test "$(docker inspect "${container_name}" --format '{{.State.ExitCode}}')" = "0"
